
<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AquaNY | Explore Water Near You</title>

  <link rel="icon" type="image/png" href="/images/favicon.png">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <!-- MapLibre -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css"
  >

  <!-- Site Styles -->
  <link rel="stylesheet" href="/static/css/sidebar.css?v=3">
  <link rel="stylesheet" href="/static/css/mappage.css?v=7">
  <link rel="stylesheet" href="/static/css/drinking-water.css">
</head>

<body>

  <!-- =====================================
       SIDEBAR
  ====================================== -->

 
<nav class="aquany-navigation" aria-label="Main navigation">
  <button
    id="aquany-menu-button"
    class="aquany-menu-button"
    type="button"
    aria-label="Open navigation menu"
    aria-controls="aquany-dropdown"
    aria-expanded="false"
  >☰</button>

  <div id="aquany-dropdown" class="aquany-dropdown" hidden>
    <a href="/">Home</a>
    <a href="/map">Interactive Map</a>
    <a href="/info">Info</a>
  </div>
</nav>


  <button
    id="toggle-btn"
    class="collapsed"
    type="button"
    aria-label="Toggle sidebar"
  >
  </button>

  <!-- =====================================
       MAIN PAGE
  ====================================== -->

  <main class="map-page">

    <!-- LEFT COLUMN -->
    <section class="map-intro reveal">

      <h1 class="map-title">
        Explore Water Near You
      </h1>

      <p class="map-text">
        Discover groundwater and surface-water monitoring
        stations near your New York ZIP code.
      </p>

      <p class="map-hint">
        Search by location to explore nearby rivers,
        lakes, streams, and groundwater monitoring wells.
      </p>


      <!-- ZIP CODE SEARCH -->

    

    </section>


    <!-- =====================================
         RIGHT COLUMN: INTERACTIVE MAP
    ====================================== -->

    <div class="map-wrapper">

      <div
        id="map"
        aria-label="Interactive map of New York water monitoring stations"
      ></div>


      <!-- MAP CONTROLS -->

      <div class="map-controls">

        <div class="view-switch">

          <button
            id="view2D"
            class="view-button"
            type="button"
            aria-pressed="false"
          >
            2D
          </button>

          <button
            id="view3D"
            class="view-button active"
            type="button"
            aria-pressed="true"
          >
            3D
          </button>

        </div>

        <button
          id="resetZoom"
          type="button"
          aria-label="Reset map view"
        >
          ↻ Reset
        </button>

      </div>

    </div>

  </main>

  <script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>

  <script type="module" src="/js/sidebar.js?v=3"></script>
  <script type="module" src="/js/mappage.js?v=7"></script>
  <script>
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      document.querySelector(".map-intro")?.classList.add("visible");
    });
  });
</script>

</body>
</html>
