<!doctype html>
<html lang="en">
<head>
  <title>AquaNY</title>

  <link rel="icon" type="image/png" href="images/favicon.png">

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css"
  >

  <link rel="stylesheet" href="/static/css/sidebar.css">
  <link rel="stylesheet" href="/static/css/mappage.css">
</head>

<body>
 
  <div id="sidebar" class="sidebar collapsed">

    <h1>💧 AquaNY</h1>

    <p class="subtitle">
      Know Your Water
    </p>

    <div class="sidebar-nav">
      <a href="/">Home</a>
      <a href="map.html">Interactive Map</a>
      <a href="/">Info</a>
    </div>

    <div id="station">
      <h2>Select a location</h2>
      <p>Click a water monitoring station.</p>
    </div>

  </div>

  <button id="toggle-btn" class="collapsed">›</button>

  <main class="map-page">

    <div class="map-intro reveal">

      <h1 class="map-title">
        View Our Map
      </h1>

      <p class="map-text">
        Visualize live water quality data across New York.
      </p>

      <p class="map-hint">
        Switch between a traditional 2D map and an interactive 3D terrain view.
      </p>

    </div>

    <div class="map-wrapper">

      <div id="map"></div>

      <div class="map-controls">

        <div class="view-switch">

          <button
            id="view2D"
            class="view-button"
            type="button"
            aria-pressed="false"
          >
            2D
          </button>

          <button
            id="view3D"
            class="view-button active"
            type="button"
            aria-pressed="true"
          >
            3D
          </button>

        </div>

        <button id="resetZoom" type="button">
          ↻ Reset
        </button>

      </div>

    </div>

  </main>

  <script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>

  <script type="module" src="/js/sidebar.js"></script>
  <script type="module" src="/js/mappage.js"></script>

</body>
</html>
